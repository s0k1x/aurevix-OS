name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  test:
    name: Pruebas (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/Aurevix.Tests --configuration Release

  build-windows:
    name: Compilar Control Center (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Compilar Control Center y sus dependencias
        run: dotnet build src/Aurevix.ControlCenter --configuration Release
      - name: Compilar AUREVIX Core Service
        run: dotnet build src/Aurevix.Service --configuration Release
      - name: Compilar AUREVIX Installer
        run: dotnet build src/Aurevix.Installer --configuration Release
      - name: Autoprueba del motor de ISOs (IMAPI2, archivo de 4,5 GB, arranque BIOS + UEFI)
        shell: pwsh
        run: |
          dotnet publish src/Aurevix.Installer -c Release -r win-x64 --self-contained -o out/inst-test
          $dir = Join-Path $env:RUNNER_TEMP 'isotest'
          Start-Process -FilePath out/inst-test/AurevixInstaller.exe -ArgumentList '--selftest-iso', $dir -Wait
          Get-Content (Join-Path $dir 'selftest-iso.txt')
          if ((Get-Content (Join-Path $dir 'selftest-iso.txt') -First 1) -ne 'OK') { exit 1 }
          $iso = Join-Path $dir 'selftest.iso'
          $img = Mount-DiskImage -ImagePath $iso -PassThru
          $letter = ($img | Get-Volume).DriveLetter
          $wim = Get-Item "${letter}:\sources\install.wim"
          Write-Host "install.wim dentro de la ISO: $($wim.Length) bytes"
          Dismount-DiskImage -ImagePath $iso | Out-Null
          if ($wim.Length -ne 4500000000) { exit 1 }
      - name: Publicar Control Center
        run: dotnet publish src/Aurevix.ControlCenter -c Release -r win-x64 --self-contained -o out/app
      - uses: actions/upload-artifact@v4
        with:
          name: control-center-win-x64
          path: out/app
          retention-days: 7
