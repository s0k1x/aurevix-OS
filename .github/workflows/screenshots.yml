name: Capturas

# Abre cada pantalla del Control Center y del Installer en un Windows real y guarda PNGs (artefacto "capturas").
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Compilar
        run: |
          ./src/Aurevix.Shell/build.ps1 -Out out/shell
          dotnet build src/Aurevix.ControlCenter -c Release -o out/cc
          dotnet build src/Aurevix.Installer -c Release -o out/inst
      - name: Capturar pantallas
        shell: pwsh
        run: |
          $dir = Join-Path $PWD 'capturas'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $p = Start-Process out/cc/AurevixControlCenter.exe -ArgumentList '--render-screenshots', "`"$dir`"" -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); Write-Warning 'Control Center: tiempo agotado' }
          $q = Start-Process out/inst/AurevixInstaller.exe -ArgumentList '--render-screenshots', "`"$dir`"" -PassThru
          if (-not $q.WaitForExit(120000)) { $q.Kill(); Write-Warning 'Installer: tiempo agotado' }
          Get-ChildItem $dir | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: capturas
          retention-days: 7
      - name: Publicar capturas en la rama ci-capturas
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          $tmp = Join-Path $env:RUNNER_TEMP 'cap'
          Copy-Item capturas $tmp -Recurse
          git checkout --orphan ci-capturas
          git rm -rf . | Out-Null
          Copy-Item "$tmp\*" . -Recurse
          git add -A
          git commit -m "Capturas $env:GITHUB_SHA"
          git push -f origin ci-capturas

  shell:
    # Prueba real de AUREVIX Shell: barra de tareas, menú Inicio y Configuración antes y después.
    runs-on: windows-latest
    needs: screenshots
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Compilar
        shell: pwsh
        run: |
          ./src/Aurevix.Shell/build.ps1 -Out out/shell
          dotnet build src/Aurevix.ControlCenter -c Release -o out/cc
          # Las apps empaquetadas (menú Inicio, Configuración) solo cargan DLL que «ALL APPLICATION PACKAGES» pueda leer.
          icacls out\cc\shell /grant "*S-1-15-2-1:(OI)(CI)RX" | Out-Null
      - name: Probar AUREVIX Shell
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type 'using System; using System.Runtime.InteropServices; public static class K { [DllImport("user32.dll")] public static extern void keybd_event(byte v, byte s, uint f, UIntPtr e); }'
          $dir = Join-Path $PWD 'shell'
          New-Item -ItemType Directory -Force $dir | Out-Null
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save((Join-Path $dir "$name.png")); $g.Dispose(); $bmp.Dispose()
          }
          function StartMenu { [K]::keybd_event(0x5B,0,0,[UIntPtr]::Zero); [K]::keybd_event(0x5B,0,2,[UIntPtr]::Zero) }
          "explorer: " + ((Get-Process explorer -ErrorAction SilentlyContinue | Measure-Object).Count) | Tee-Object -Append (Join-Path $dir 'info.txt')
          [Environment]::OSVersion.VersionString | Tee-Object -Append (Join-Path $dir 'info.txt')
          Shot 'shell-01-antes'
          StartMenu; Start-Sleep 3; Shot 'shell-02-inicio-antes'; StartMenu; Start-Sleep 1
          Start-Process ms-settings:personalization; Start-Sleep 6; Shot 'shell-03-config-antes'
          Get-Process SystemSettings -ErrorAction SilentlyContinue | Stop-Process -Force; Start-Sleep 2
          $res = Join-Path $dir 'resultado.txt'
          # Como en un PC normal: sin permisos de administrador. Lo que lanza el Explorador hereda su nivel (medio);
          # lo que lanza el runner directamente es de administrador y Windows no deja que la barra de tareas se conecte a él.
          $cc = (Resolve-Path out/cc/AurevixControlCenter.exe).Path
          function AsUser($argsLine, $name) {
            $cmd = Join-Path $env:TEMP "$name.cmd"
            Set-Content -Path $cmd -Value "@echo off`r`nstart `"`" `"$cc`" $argsLine" -Encoding ascii
            Start-Process explorer.exe -ArgumentList "`"$cmd`""
          }
          AsUser "--shell-test `"$res`"" 'shelltest'
          for ($i = 0; $i -lt 70 -and -not (Test-Path $res); $i++) { Start-Sleep 1 }
          Start-Sleep 9
          Get-Content $res -ErrorAction SilentlyContinue
          Start-Sleep 3; Shot 'shell-04-despues'
          # El Control Center normal aplica también menú Inicio y Configuración en segundo plano.
          AsUser '--background' 'bg'
          Start-Sleep 10
          StartMenu; Start-Sleep 4; Shot 'shell-05-inicio-despues'; StartMenu; Start-Sleep 1
          Start-Process ms-settings:personalization; Start-Sleep 9; Shot 'shell-06-config-despues'
          Copy-Item (Join-Path $env:TEMP 'aurevix-shell.log') $dir -ErrorAction SilentlyContinue
          Get-ChildItem "$env:LOCALAPPDATA\Packages" -Recurse -Filter aurevix-shell.log -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName (Join-Path $dir ("log-" + $_.Directory.Parent.Name + ".log")) }
          Get-ChildItem "$env:LOCALAPPDATA\Aurevix\logs" -ErrorAction SilentlyContinue | Select-Object -Last 1 | ForEach-Object { Copy-Item $_.FullName (Join-Path $dir 'controlcenter.log') }
          Get-ChildItem $dir | Format-Table Name, Length
          Get-Process AurevixControlCenter -IncludeUserName -ErrorAction SilentlyContinue | Format-Table Id, UserName, StartTime
          Get-Content (Join-Path $dir 'aurevix-shell.log') -ErrorAction SilentlyContinue
          Get-Content (Join-Path $dir 'controlcenter.log') -ErrorAction SilentlyContinue
      - name: Todo instalado (estilo completo + Shell)
        shell: pwsh
        run: |
          Get-Process AurevixControlCenter -ErrorAction SilentlyContinue | Stop-Process -Force
          $dir = Join-Path $PWD 'shell\todo'
          New-Item -ItemType Directory -Force $dir | Out-Null
          # Iconos de carpetas y unidades para todo el equipo (en un PC normal los pone AUREVIX Core Service).
          $icons = (Resolve-Path out/cc/Assets/Icons).Path
          $k = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Shell Icons'
          New-Item -Path $k -Force | Out-Null
          $map = @{ '0'='file'; '1'='file-text'; '2'='app'; '3'='folder'; '4'='folder-open'; '7'='usb'; '8'='drive'; '9'='network-drive'; '11'='disc'; '15'='pc'; '16'='printer'; '17'='network'; '29'='shortcut'; '34'='desktop'; '43'='favorites'; '47'='lock' }
          foreach ($i in $map.Keys) { Set-ItemProperty -Path $k -Name $i -Value "$icons\$($map[$i]).ico,0" }
          New-Item -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\DriveIcons\C\DefaultIcon' -Force | Out-Null
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\DriveIcons\C\DefaultIcon' -Name '(default)' -Value "$icons\ssd.ico,0"
          $cc = (Resolve-Path out/cc/AurevixControlCenter.exe).Path
          $cmd = Join-Path $env:TEMP 'todo.cmd'
          Set-Content -Path $cmd -Value "@echo off`r`nstart `"`" `"$cc`" --render-installed `"$dir`"" -Encoding ascii
          Start-Process explorer.exe -ArgumentList "`"$cmd`""
          for ($i = 0; $i -lt 240 -and -not (Test-Path (Join-Path $dir 'todo-info.txt')) -and -not (Test-Path (Join-Path $dir 'error-todo.txt')); $i++) { Start-Sleep 1 }
          Get-ChildItem $dir | Format-Table Name, Length
          Get-Content (Join-Path $dir 'todo-info.txt'), (Join-Path $dir 'error-todo.txt') -ErrorAction SilentlyContinue
          Copy-Item (Join-Path $env:TEMP 'aurevix-shell.log') (Join-Path $dir 'aurevix-shell.log') -ErrorAction SilentlyContinue
      - name: Añadir a la rama ci-capturas
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          $tmp = Join-Path $env:RUNNER_TEMP 'shl'
          Copy-Item shell $tmp -Recurse
          git reset -q --hard; git clean -ffdxq
          git fetch origin ci-capturas --depth 1
          git checkout -B ci-capturas FETCH_HEAD
          if (Test-Path shell) { Remove-Item shell -Recurse -Force }
          Copy-Item $tmp shell -Recurse
          git add -A
          git commit -m "Prueba AUREVIX Shell $env:GITHUB_SHA"
          git push origin ci-capturas
